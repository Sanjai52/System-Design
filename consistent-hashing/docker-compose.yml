      - 27032:27017
    volumes:
      - ./data/node3:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27017", "--eval", "db.runCommand({ping:1})"]
      interval: 3s
      retries: 20
    networks:
      - ch-net

  node4:
    image: mongo:7.0
