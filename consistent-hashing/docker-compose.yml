      test: ["CMD", "mongosh", "--quiet", "--port", "27017", "--eval", "db.runCommand({ping:1})"]
      interval: 3s
      retries: 20
    networks:
      - ch-net
    profiles:
      - extra

networks:
  ch-net:
    driver: bridge
