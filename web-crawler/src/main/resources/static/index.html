<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Crawler</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none; z-index: 0;
        }
        .bg-glow {
            position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
            animation: pulse 8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
        }
        .container {
            position: relative; z-index: 1;
            max-width: 900px; margin: 0 auto; padding: 40px 20px;
        }
        header { text-align: center; margin-bottom: 40px; }
        h1 {
            font-size: 2rem; font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle { color: #94a3b8; font-size: 0.95rem; }
        .card {
            background: rgba(30, 30, 60, 0.6);
            border: 1px solid rgba(59,130,246,0.15);
            border-radius: 12px; padding: 28px;
            backdrop-filter: blur(10px);
            margin-bottom: 24px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            border-color: rgba(59,130,246,0.35);
            box-shadow: 0 0 20px rgba(59,130,246,0.08);
        }
        .card h2 {
            font-size: 1.1rem; color: #93c5fd; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block; font-size: 0.85rem; color: #94a3b8;
            margin-bottom: 6px;
        }
        .input-group input, .input-group select {
            width: 100%; padding: 10px 14px;
            background: rgba(15,15,35,0.8);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 8px; color: #e0e0e0;
            font-size: 0.95rem; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .btn {
            padding: 10px 24px; border: none; border-radius: 8px;
            font-size: 0.95rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(59,130,246,0.4);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        .btn-danger:hover {
            box-shadow: 0 4px 15px rgba(239,68,68,0.3);
        }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .row .input-group { flex: 1; min-width: 120px; }
        .status-bar {
            display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px;
        }
        .stat {
            flex: 1; min-width: 100px; text-align: center; padding: 14px;
            background: rgba(15,15,35,0.6); border-radius: 8px;
            border: 1px solid rgba(59,130,246,0.1);
        }
        .stat-value {
            font-size: 1.5rem; font-weight: 700;
            color: #60a5fa;
        }
        .stat-label { font-size: 0.75rem; color: #64748b; margin-top: 4px; }
        .status-badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
        }
        .status-QUEUED { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .status-CRAWLING { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .status-COMPLETED { background: rgba(34,197,94,0.15); color: #4ade80; }
        .status-FAILED { background: rgba(239,68,68,0.15); color: #f87171; }
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="container">
        <header>
            <h1>Web Crawler</h1>
            <p class="subtitle">BFS-based web crawler with Redis state management</p>
            <p style="margin-top:12px">
                <a class="btn btn-primary" href="/hierarchy.html" style="text-decoration:none;display:inline-block">
                    View Hierarchy
                </a>
                <a class="btn btn-primary" href="/search.html" style="text-decoration:none;display:inline-block;margin-left:8px">
                    Search Pages
                </a>
            </p>
        </header>

        <div class="card">
            <h2>Start New Crawl</h2>
            <div class="input-group">
                <label>Seed URL</label>
                <input type="text" id="seedUrl" placeholder="https://example.com" value="https://example.com">
            </div>
            <div class="row">
                <div class="input-group">
                    <label>Max Pages</label>
                    <input type="number" id="maxPages" value="10" min="1" max="100">
                </div>
                <div class="input-group" style="flex:0 0 auto">
                    <button class="btn btn-primary" id="startBtn" onclick="startCrawl()">
                        Start Crawl
                    </button>
                </div>
            </div>
        </div>

        <div class="card hidden" id="statusCard">
            <h2>
                Crawl Status
                <span id="jobBadge"></span>
                <button class="btn btn-danger btn-sm" style="margin-left:auto" onclick="stopCrawl()">Stop</button>
            </h2>
            <div id="jobIdLine" style="font-size:0.8rem;color:#94a3b8;margin-bottom:12px;word-break:break-all"></div>
            <div class="status-bar">
                <div class="stat">
                    <div class="stat-value" id="statPages">0</div>
                    <div class="stat-label">Pages Crawled</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statDiscovered">0</div>
                    <div class="stat-label">URLs Discovered</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statVisited">0</div>
                    <div class="stat-label">Results</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statFailed" style="color:#f87171">0</div>
                    <div class="stat-label">Failed</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentJobId = null;
        let pollInterval = null;

        async function startCrawl() {
            const seedUrl = document.getElementById('seedUrl').value.trim();
            const maxPages = parseInt(document.getElementById('maxPages').value) || 10;

            if (!seedUrl) { return; }

            document.getElementById('startBtn').innerHTML = '<span class="spinner"></span> Starting...';

            try {
                const res = await fetch('/api/crawl', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: seedUrl, maxPages })
                });
                const data = await res.json();

                if (res.ok) {
                    currentJobId = data.jobId;
                    document.getElementById('jobIdLine').textContent = 'Job ID: ' + data.jobId;
                    document.getElementById('statusCard').classList.remove('hidden');
                    startPolling();
                }
            } catch (e) { /* ignore connection errors */ }

            document.getElementById('startBtn').innerHTML = 'Start Crawl';
        }

        async function stopCrawl() {
            if (!currentJobId) return;
            try {
                await fetch(`/api/crawl/${currentJobId}`, { method: 'DELETE' });
                stopPolling();
                updateStatus('COMPLETED');
            } catch (e) { /* ignore */ }
        }

        function startPolling() {
            stopPolling();
            pollInterval = setInterval(pollStatus, 1000);
        }

        function stopPolling() {
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        }

        async function pollStatus() {
            if (!currentJobId) return;
            try {
                const res = await fetch(`/api/crawl/${currentJobId}`);
                if (!res.ok) return;
                const data = await res.json();

                document.getElementById('statPages').textContent = data.pagesCrawled;
                document.getElementById('statDiscovered').textContent = data.urlsDiscovered;
                updateStatus(data.status);

                if (data.status === 'COMPLETED') {
                    stopPolling();
                }

                await pollUrls();
            } catch (e) { /* ignore polling errors */ }
        }

        async function pollUrls() {
            if (!currentJobId) return;
            try {
                const res = await fetch(`/api/crawl/${currentJobId}/urls`);
                if (!res.ok) return;
                const urls = await res.json();

                document.getElementById('statVisited').textContent = urls.length;
                document.getElementById('statFailed').textContent = urls.filter(u => u.status === 'FAILED').length;
            } catch (e) { /* ignore */ }
        }

        function updateStatus(status) {
            const badge = document.getElementById('jobBadge');
            badge.innerHTML = `<span class="status-badge status-${status}">${status}</span>`;
        }
    </script>
</body>
</html>
