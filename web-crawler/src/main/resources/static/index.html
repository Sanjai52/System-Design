<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Crawler</title>
    <style>
        :root {
            --bg: #f7f5f1;
            --surface: #ffffff;
            --ink: #292524;
            --muted: #78716c;
            --faint: #a8a29e;
            --line: #e9e2d5;
            --accent: #0f766e;
            --accent-dark: #115e59;
            --danger: #b45349;
            --danger-dark: #9a463e;
            --focus-ring: rgba(15, 118, 110, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }
        .container {
            max-width: 760px; margin: 0 auto; padding: 48px 20px;
        }
        header { margin-bottom: 32px; }
        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.9rem; font-weight: 500; color: var(--ink);
            margin-bottom: 6px;
        }
        .subtitle { color: var(--muted); font-size: 0.95rem; }
        nav { margin-top: 14px; font-size: 0.9rem; }
        nav a { color: var(--accent); text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        nav span { color: var(--faint); margin: 0 8px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px; padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 1px 2px rgba(41, 37, 36, 0.04);
        }
        .card h2 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.15rem; font-weight: 500; color: var(--ink);
            margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block; font-size: 0.85rem; color: var(--muted);
            margin-bottom: 6px;
        }
        .input-group input, .input-group select {
            width: 100%; padding: 9px 12px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 7px; color: var(--ink);
            font-size: 0.95rem; outline: none;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }
        .btn {
            padding: 9px 20px; border: none; border-radius: 7px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            text-decoration: none; display: inline-block;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-dark); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: var(--danger-dark); }
        .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .row .input-group { flex: 1; min-width: 120px; }
        .status-bar {
            display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 4px;
        }
        .stat {
            flex: 1; min-width: 100px; text-align: center; padding: 12px;
            background: var(--bg); border-radius: 7px;
            border: 1px solid var(--line);
        }
        .stat-value { font-size: 1.4rem; font-weight: 600; color: var(--ink); }
        .stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
        .status-badge {
            display: inline-block; padding: 2px 10px; border-radius: 20px;
            font-size: 0.72rem; font-weight: 600;
        }
        .status-QUEUED { background: #fef3c7; color: #92400e; }
        .status-CRAWLING { background: #ccfbf1; color: #0f766e; }
        .status-COMPLETED { background: #dcfce7; color: #15803d; }
        .status-FAILED { background: #fee2e2; color: #b91c1c; }
        #jobIdLine { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; word-break: break-all; }
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Web Crawler</h1>
            <p class="subtitle">BFS-based web crawler with Redis state management</p>
            <nav>
                <a href="/hierarchy.html">Hierarchy</a><span>·</span><a href="/search.html">Search pages</a><span>·</span><a href="/discover.html">Discover</a>
            </nav>
        </header>

        <div class="card">
            <h2>Start new crawl</h2>
            <div class="input-group">
                <label>Seed URL</label>
                <input type="text" id="seedUrl" placeholder="https://example.com" value="https://example.com">
            </div>
            <div class="row">
                <div class="input-group">
                    <label>Max Pages</label>
                    <input type="number" id="maxPages" value="10" min="1" max="100">
                </div>
                <div class="input-group" style="flex:0 0 auto">
                    <button class="btn btn-primary" id="startBtn" onclick="startCrawl()">
                        Start crawl
                    </button>
                </div>
            </div>
        </div>

        <div class="card hidden" id="statusCard">
            <h2>
                Crawl status
                <span id="jobBadge"></span>
                <button class="btn btn-danger btn-sm" style="margin-left:auto" onclick="stopCrawl()">Stop</button>
            </h2>
            <div id="jobIdLine"></div>
            <div class="status-bar">
                <div class="stat">
                    <div class="stat-value" id="statPages">0</div>
                    <div class="stat-label">Pages crawled</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statDiscovered">0</div>
                    <div class="stat-label">URLs discovered</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statVisited">0</div>
                    <div class="stat-label">Results</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statFailed" style="color:#b91c1c">0</div>
                    <div class="stat-label">Failed</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentJobId = null;
        let pollInterval = null;

        async function startCrawl() {
            const seedUrl = document.getElementById('seedUrl').value.trim();
            const maxPages = parseInt(document.getElementById('maxPages').value) || 10;

            if (!seedUrl) { return; }

            document.getElementById('startBtn').innerHTML = '<span class="spinner"></span> Starting...';

            try {
                const res = await fetch('/api/crawl', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: seedUrl, maxPages })
                });
                const data = await res.json();

                if (res.ok) {
                    currentJobId = data.jobId;
                    document.getElementById('jobIdLine').textContent = 'Job ID: ' + data.jobId;
                    document.getElementById('statusCard').classList.remove('hidden');
                    startPolling();
                }
            } catch (e) { /* ignore connection errors */ }

            document.getElementById('startBtn').innerHTML = 'Start crawl';
        }

        async function stopCrawl() {
            if (!currentJobId) return;
            try {
                await fetch(`/api/crawl/${currentJobId}`, { method: 'DELETE' });
                stopPolling();
                updateStatus('COMPLETED');
            } catch (e) { /* ignore */ }
        }

        function startPolling() {
            stopPolling();
            pollInterval = setInterval(pollStatus, 1000);
        }

        function stopPolling() {
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        }

        async function pollStatus() {
            if (!currentJobId) return;
            try {
                const res = await fetch(`/api/crawl/${currentJobId}`);
                if (!res.ok) return;
                const data = await res.json();

                document.getElementById('statPages').textContent = data.pagesCrawled;
                document.getElementById('statDiscovered').textContent = data.urlsDiscovered;
                updateStatus(data.status);

                if (data.status === 'COMPLETED') {
                    stopPolling();
                }

                await pollUrls();
            } catch (e) { /* ignore polling errors */ }
        }

        async function pollUrls() {
            if (!currentJobId) return;
            try {
                const res = await fetch(`/api/crawl/${currentJobId}/urls`);
                if (!res.ok) return;
                const urls = await res.json();

                document.getElementById('statVisited').textContent = urls.length;
                document.getElementById('statFailed').textContent = urls.filter(u => u.status === 'FAILED').length;
            } catch (e) { /* ignore */ }
        }

        function updateStatus(status) {
            const badge = document.getElementById('jobBadge');
            badge.innerHTML = `<span class="status-badge status-${status}">${status}</span>`;
        }
    </script>
</body>
</html>
