<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Pages</title>
<style>
:root{
  --bg:#f7f5f1; --surface:#fff; --ink:#292524; --muted:#78716c; --faint:#a8a29e;
  --line:#e9e2d5; --accent:#0f766e; --accent-dark:#115e59; --focus-ring:rgba(15,118,110,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.container{max-width:760px;margin:0 auto;padding:48px 20px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{margin-bottom:28px}
header h1{font-family:Georgia,'Times New Roman',serif;font-size:1.7rem;font-weight:500;margin-bottom:6px}
header nav{font-size:.9rem;color:var(--faint)}
header nav a{margin:0 4px}
header nav a:first-child{margin-left:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 1px 2px rgba(41,37,36,.04)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:200px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-size:.9rem;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
button{padding:9px 18px;border:none;border-radius:7px;font-size:.88rem;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
button:hover{background:var(--accent-dark)}
.hit{padding:12px 4px;border-bottom:1px solid var(--line)}
.hit .title{font-size:1rem;font-weight:600}
.hit .url{font-size:.78rem;color:var(--faint);word-break:break-all}
.hit .snippet{font-size:.85rem;color:#57534e;margin-top:4px;line-height:1.5}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:600;background:#ccfbf1;color:#0f766e;margin-left:8px}
#error{color:#b45349;margin-top:8px;min-height:1.2em;font-size:.88rem}
.meta{font-size:.85rem;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="container">
<header><h1>Search pages</h1><nav><a href="/">Crawler</a> · <a href="/hierarchy.html">Hierarchy</a></nav></header>
<div class="card">
<div class="row">
<input id="q" placeholder="Search indexed pages… (e.g. example)" onkeydown="if(event.key==='Enter')doSearch()">
<button onclick="doSearch()">Search</button>
</div>
<div id="error"></div>
<div id="meta" class="meta"></div>
<div id="results"></div>
</div>
</div>
<script>
async function doSearch(){
  const q=document.getElementById('q').value.trim();
  const err=document.getElementById('error');
  const box=document.getElementById('results');
  const meta=document.getElementById('meta');
  err.textContent='';box.innerHTML='';meta.textContent='';
  if(!q){err.textContent='Type something to search';return;}
  const res=await fetch(`/api/search?q=${encodeURIComponent(q)}&limit=10`);
  if(!res.ok){err.textContent='Search failed: '+res.status;return;}
  const hits=await res.json();
  if(!hits.length){meta.textContent=`No pages match "${q}" yet — run a crawl first.`;return;}
  meta.textContent=`${hits.length} result(s) for "${q}"`;
  box.innerHTML=hits.map(h=>`<div class="hit"><span class="title"><a href="${escapeAttr(h.url)}" target="_blank" rel="noopener">${escapeHtml(h.title||h.url)}</a></span><span class="badge">${Number(h.score).toFixed(4)}</span><div class="url">${escapeHtml(h.url)}</div><div class="snippet">${escapeHtml(h.snippet||'')}</div></div>`).join('');
}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,'&#96;');}
</script>
</body>
</html>
