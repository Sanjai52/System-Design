<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crawl Hierarchy</title>
<style>
:root{
  --bg:#f7f5f1; --surface:#fff; --ink:#292524; --muted:#78716c; --faint:#a8a29e;
  --line:#e9e2d5; --accent:#0f766e; --accent-dark:#115e59; --focus-ring:rgba(15,118,110,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.container{max-width:860px;margin:0 auto;padding:48px 20px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{margin-bottom:28px}
header h1{font-family:Georgia,'Times New Roman',serif;font-size:1.7rem;font-weight:500;margin-bottom:6px}
header nav{font-size:.9rem;color:var(--faint)}
header nav a{margin:0 4px}
header nav a:first-child{margin-left:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 1px 2px rgba(41,37,36,.04)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:180px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-size:.9rem;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
button{padding:9px 18px;border:none;border-radius:7px;font-size:.88rem;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
button:hover{background:var(--accent-dark)}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.ghost:hover{background:#f0ede6;border-color:#d6cfbf}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:.8rem;color:var(--muted)}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
.s-QUEUED{background:#fef3c7;color:#92400e}.s-CRAWLING{background:#ccfbf1;color:#0f766e}.s-COMPLETED{background:#dcfce7;color:#15803d}.s-FAILED{background:#fee2e2;color:#b91c1c}.s-DISCOVERED{background:#e7e5e4;color:#57534e}
ul.tree{list-style:none;margin-top:12px}
ul.tree ul{margin-left:20px;border-left:1px solid var(--line);padding-left:14px}
.node{margin:6px 0;font-size:.9rem}
.toggle{cursor:pointer;user-select:none;margin-right:6px;color:var(--accent);font-weight:700}
.leaf{display:inline-block;width:14px;margin-right:6px;color:var(--faint)}
.url{word-break:break-all}
.meta{font-size:.75rem;color:var(--muted);margin-left:8px}
.visited{font-size:.7rem;color:#92400e;border:1px solid #f0dca8;border-radius:10px;padding:0 8px;margin-left:8px;background:#fffbeb}
#latestLine{margin-top:10px;font-size:.85rem;color:var(--muted)}
#error{color:#b45349;margin-top:8px;min-height:1.2em;font-size:.88rem}
#counts{color:var(--muted);font-size:.85rem}
.results{margin-top:10px;font-size:.85rem}
.results div{padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px}
.results div:hover{background:#f0ede6}
p.empty{color:var(--faint)}
</style>
</head>
<body>
<div class="container">
<header><h1>Crawl hierarchy</h1><nav><a href="/">Crawler</a> · <a href="/search.html">Search pages</a></nav></header>
<div class="card">
<div class="row">
<input id="jobId" placeholder="Job ID (e.g. d4fbe0b3-…)">
<input id="seed" placeholder="or search seed URL contains… (e.g. example)">
<input id="depth" type="number" min="1" max="20" placeholder="Max depth" style="flex:0 0 110px">
<button onclick="loadById()">Load tree</button>
<button class="ghost" onclick="searchSeed()">Search</button>
</div>
<div class="row" style="margin-top:10px">
<button class="ghost" onclick="expandAll(true)">Expand all</button>
<button class="ghost" onclick="expandAll(false)">Collapse all</button>
<span id="counts" style="align-self:center"></span>
</div>
<div class="legend"><span><span class="badge s-COMPLETED">completed</span> done</span><span><span class="badge s-CRAWLING">crawling</span> active</span><span><span class="badge s-FAILED">failed</span> error</span><span><span class="badge s-QUEUED">queued</span> waiting</span><span class="visited">already visited</span> cycle ref (not expanded)</div>
<div id="latestLine"></div>
<div id="error"></div>
<div id="searchResults" class="results"></div>
</div>
<div class="card"><div id="treeWrap"><p class="empty">Enter a job ID or search by seed URL to see the discovery tree.</p></div></div>
</div>
<script>
let total=0;
window.addEventListener('DOMContentLoaded',loadLatest);
async function loadLatest(){
  try{
    const res=await fetch('/api/crawl/latest');
    if(!res.ok)return;
    const j=await res.json();
    if(!j||!j.jobId)return;
    document.getElementById('jobId').value=j.jobId;
    document.getElementById('latestLine').innerHTML=`Latest job: <span class="badge s-${j.status}">${j.status}</span> <b>${escapeHtml(j.seedUrl||'')}</b> <span class="meta">${j.jobId}</span>`;
    await loadTree(j.jobId,'');
  }catch(e){/* no jobs yet — user can search instead */}
}
async function loadById(){
  const id=document.getElementById('jobId').value.trim();
  if(!id){showError('Enter a jobId first');return;}
  const d=document.getElementById('depth').value.trim();
  await loadTree(id,d?`?maxDepth=${encodeURIComponent(d)}`:'');
}
async function searchSeed(){
  const q=document.getElementById('seed').value.trim();
  if(!q){showError('Enter seed text to search');return;}
  showError('');
  const res=await fetch(`/api/crawl/search?seedUrl=${encodeURIComponent(q)}`);
  if(!res.ok){showError('Search failed: '+res.status);return;}
  const jobs=await res.json();
  const box=document.getElementById('searchResults');
  if(!jobs.length){box.innerHTML='<p class="empty">No jobs match "'+escapeHtml(q)+'"</p>';return;}
  box.innerHTML=jobs.map(j=>`<div data-id="${j.jobId}"><span class="badge s-${j.status}">${j.status}</span> <b>${escapeHtml(j.seedUrl||'')}</b> <span class="meta">${j.pagesCrawled}/${j.maxPages} pages · ${j.jobId}</span></div>`).join('');
  box.querySelectorAll('div[data-id]').forEach(el=>el.onclick=()=>{document.getElementById('jobId').value=el.dataset.id;loadTree(el.dataset.id,'');});
}
async function loadTree(id,qs){
  showError('');document.getElementById('searchResults').innerHTML='';
  const res=await fetch(`/api/crawl/${encodeURIComponent(id)}/hierarchy${qs}`);
  if(res.status===404){showError('Job not found: '+id);return;}
  if(!res.ok){showError('Failed to load hierarchy: '+res.status);return;}
  const data=await res.json();
  total=0;countNodes(data.tree);
  document.getElementById('counts').textContent=`${total} nodes · seed ${data.seedUrl||''} · ${data.status||''}`;
  document.getElementById('treeWrap').innerHTML=`<ul class="tree">${renderNode(data.tree,true)}</ul>`;
  bindToggles();
}
function countNodes(n){if(!n)return;total++;(n.children||[]).forEach(countNodes);}
function renderNode(n,isRoot){
  const kids=n.children||[];
  const has=kids.length>0;
  const caret=has?`<span class="toggle" data-open="true">▾</span>`:`<span class="leaf">•</span>`;
  const visited=n.alreadyVisited?`<span class="visited">already visited</span>`:'';
  let h=`<li class="node">${caret}<span class="badge s-${n.status}">${n.status}</span> <span class="url">${escapeHtml(n.url)}</span><span class="meta">d${n.depth} · ${n.discoveredLinks} links</span>${visited}`;
  if(has){h+=`<ul class="tree">${kids.map(k=>renderNode(k,false)).join('')}</ul>`;}
  return h+'</li>';
}
function bindToggles(){
  document.querySelectorAll('.toggle').forEach(t=>{
    t.onclick=()=>{
      const open=t.dataset.open==='true';
      t.dataset.open=open?'false':'true';
      t.textContent=open?'▸':'▾';
      const ul=t.parentElement.querySelector(':scope > ul');
      if(ul)ul.style.display=open?'none':'';
    };
  });
}
function expandAll(open){
  document.querySelectorAll('.toggle').forEach(t=>{
    t.dataset.open=open?'true':'false';t.textContent=open?'▾':'▸';
    const ul=t.parentElement.querySelector(':scope > ul');
    if(ul)ul.style.display=open?'':'none';
  });
}
function showError(m){document.getElementById('error').textContent=m;}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
