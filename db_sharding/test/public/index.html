<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MongoDB Shard Visualizer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

header { text-align: center; padding: 2rem 1rem 1rem; border-bottom: 1px solid #1e293b; }
header h1 { font-size: 1.5rem; color: #38bdf8; }
header p { color: #64748b; margin-top: 0.25rem; font-size: 0.875rem; }

.container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }

.form-section { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
.form-section h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 1rem; }
.form-row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: end; }
.form-row input, .form-row select {
  background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem;
  padding: 0.625rem 0.875rem; color: #e2e8f0; font-size: 0.875rem; outline: none;
  transition: border-color 0.2s;
}
.form-row input:focus, .form-row select:focus { border-color: #38bdf8; }
.form-row input { width: 120px; }
.form-row input[name="Name"] { width: 140px; }
.form-row input[name="Dept"] { width: 100px; }
.form-row select { width: 80px; cursor: pointer; }
.form-row button {
  background: #38bdf8; color: #0f172a; border: none; border-radius: 0.5rem;
  padding: 0.625rem 1.25rem; font-weight: 600; cursor: pointer; font-size: 0.875rem;
  transition: opacity 0.2s;
}
.form-row button:hover { opacity: 0.85; }
.form-row button:disabled { opacity: 0.4; cursor: not-allowed; }

#feedback { margin-top: 0.75rem; font-size: 0.875rem; min-height: 1.25rem; }
#feedback .shard1 { color: #a78bfa; }
#feedback .shard2 { color: #f97316; }
#feedback .both { color: #34d399; }

.shards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
.shard-box { background: #1e293b; border-radius: 0.75rem; padding: 1rem; min-height: 200px; position: relative; }
.shard-box h3 { font-size: 0.875rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
.shard-box h3 .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.shard-box h3 .count { margin-left: auto; font-size: 0.75rem; color: #64748b; }
.shard1-box { border-top: 3px solid #a78bfa; }
.shard2-box { border-top: 3px solid #f97316; }
.shard1-box .dot { background: #a78bfa; }
.shard2-box .dot { background: #f97316; }

.shard-content { display: flex; flex-wrap: wrap; gap: 0.375rem; align-content: start; }
.student-card {
  background: #0f172a; border-radius: 0.375rem; padding: 0.375rem 0.5rem;
  font-size: 0.75rem; animation: pop 0.3s ease-out;
  border-left: 2px solid transparent;
}
.student-card .rollno { color: #94a3b8; font-weight: 600; }
.student-card .name { color: #e2e8f0; }
.shard1-box .student-card { border-left-color: #a78bfa; }
.shard2-box .student-card { border-left-color: #f97316; }

@keyframes pop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.stats-bar { background: #1e293b; border-radius: 0.75rem; padding: 1rem; }
.stats-bar h3 { font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.75rem; }
.bar-track { height: 1.5rem; background: #0f172a; border-radius: 0.75rem; overflow: hidden; display: flex; }
.bar-segment { height: 100%; transition: width 0.5s ease; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; color: #0f172a; min-width: fit-content; padding: 0 0.5rem; }
.bar-shard1 { background: #a78bfa; }
.bar-shard2 { background: #f97316; }

.actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
.actions button {
  background: transparent; border: 1px solid #334155; border-radius: 0.5rem;
  padding: 0.5rem 1rem; color: #94a3b8; cursor: pointer; font-size: 0.75rem;
  transition: all 0.2s;
}
.actions button:hover { border-color: #ef4444; color: #ef4444; }

.flow-arrow { display: none; text-align: center; padding: 0.25rem 0; color: #38bdf8; font-size: 0.75rem; }
.flow-arrow.active { display: block; animation: pulse 0.5s ease 3; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
</style>
</head>
<body>
<header>
  <h1>MongoDB Shard Visualizer</h1>
  <p>College.Student — Range sharding on RollNo</p>
</header>

<div class="container">
  <div class="form-section">
    <h2>Add Student</h2>
    <div class="form-row">
      <input type="number" name="RollNo" placeholder="RollNo" min="1001">
      <input type="text" name="Name" placeholder="Name">
      <input type="text" name="Dept" placeholder="Dept" value="CS" maxlength="4">
      <select name="Year">
        <option value="1">Yr 1</option>
        <option value="2">Yr 2</option>
        <option value="3" selected>Yr 3</option>
        <option value="4">Yr 4</option>
      </select>
      <button id="addBtn" onclick="addStudent()">Add Student</button>
      <button onclick="addBatch()">+10 Batch</button>
    </div>
    <div id="feedback"></div>
  </div>

  <div class="flow-arrow" id="flowArrow">⬇ mongos routing based on RollNo shard key ⬇</div>

  <div class="shards">
    <div class="shard-box shard1-box">
      <h3><span class="dot"></span> Shard 1 <span class="count" id="s1count">0</span></h3>
      <div class="shard-content" id="shard1Content"></div>
    </div>
    <div class="shard-box shard2-box">
      <h3><span class="dot"></span> Shard 2 <span class="count" id="s2count">0</span></h3>
      <div class="shard-content" id="shard2Content"></div>
    </div>
  </div>

  <div class="stats-bar">
    <h3>Distribution</h3>
    <div class="bar-track" id="barTrack">
      <div class="bar-segment bar-shard1" id="barShard1" style="width:0%">0</div>
      <div class="bar-segment bar-shard2" id="barShard2" style="width:0%">0</div>
    </div>
    <div class="actions">
      <button onclick="refresh()">Refresh</button>
      <button onclick="splitShards()">Split & Balance</button>
      <button onclick="resetData()">Reset All Data</button>
    </div>
  </div>
</div>

<script>
let studentCache = []

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts })
  return r.json()
}

async function refresh() {
  const [students, dist] = await Promise.all([api('/api/students'), api('/api/distribution')])
  studentCache = students

  const s1el = document.getElementById('shard1Content')
  const s2el = document.getElementById('shard2Content')
  document.getElementById('s1count').textContent = dist.shard1
  document.getElementById('s2count').textContent = dist.shard2

  s1el.innerHTML = students.filter(s => s.shard === 'shard1' || s.shard === 'both')
    .map(s => studentCard(s, 'shard1')).join('')
  s2el.innerHTML = students.filter(s => s.shard === 'shard2' || s.shard === 'both')
    .map(s => studentCard(s, 'shard2')).join('')

  const total = dist.shard1 + dist.shard2 || 1
  const p1 = (dist.shard1 / total * 100).toFixed(0)
  const p2 = (dist.shard2 / total * 100).toFixed(0)
  document.getElementById('barShard1').style.width = p1 + '%'
  document.getElementById('barShard2').style.width = p2 + '%'
  document.getElementById('barShard1').textContent = dist.shard1 ? `Shard1 ${p1}%` : ''
  document.getElementById('barShard2').textContent = dist.shard2 ? `Shard2 ${p2}%` : ''
}

function studentCard(s, shard) {
  return `<div class="student-card"><span class="rollno">#${s.RollNo}</span> <span class="name">${s.Name}</span></div>`
}

let adding = false
async function addStudent(rollno, name, dept, year) {
  if (adding) return
  adding = true
  const btn = document.getElementById('addBtn')
  btn.disabled = true

  const RollNo = rollno || parseInt(document.querySelector('input[name="RollNo"]').value)
  const Name = name || document.querySelector('input[name="Name"]').value
  const Dept = dept || document.querySelector('input[name="Dept"]').value
  const Year = year || parseInt(document.querySelector('select[name="Year"]').value)

  if (!RollNo || !Name) {
    document.getElementById('feedback').textContent = 'RollNo and Name required'
    adding = false; btn.disabled = false; return
  }

  document.getElementById('feedback').textContent = `Inserting ${Name} (RollNo ${RollNo}) through mongos...`
  const arrow = document.getElementById('flowArrow')
  arrow.classList.add('active')

  const result = await api('/api/student', {
    method: 'POST',
    body: JSON.stringify({ RollNo, Name, Dept, Year })
  })

  arrow.classList.remove('active')
  const fb = document.getElementById('feedback')
  if (result.landed === 'shard1') {
    fb.innerHTML = `<span class="shard1">${Name} → Shard 1 (RollNo ${RollNo})</span>`
  } else if (result.landed === 'shard2') {
    fb.innerHTML = `<span class="shard2">${Name} → Shard 2 (RollNo ${RollNo})</span>`
  } else if (result.landed === 'both') {
    fb.innerHTML = `<span class="both">${Name} → Both shards (RollNo ${RollNo})</span>`
  } else {
    fb.textContent = `Inserted, but couldn't locate on either shard`
  }

  if (!rollno) {
    document.querySelector('input[name="RollNo"]').value = ''
    document.querySelector('input[name="Name"]').value = ''
  }
  await refresh()
  adding = false
  btn.disabled = false
}

async function addBatch() {
  document.getElementById('feedback').textContent = 'Adding 10 students...'
  const depts = ['CS', 'EC', 'ME']
  const names = ['Liam','Emma','Noah','Olivia','James','Ava','William','Sophia','Oliver','Mia']
  for (let i = 0; i < 10; i++) {
    const rollno = 1021 + i
    await addStudent(rollno, names[i], depts[i % 3], (i % 4) + 1)
  }
}

async function splitShards() {
  document.getElementById('feedback').textContent = 'Splitting chunks and balancing...'
  await api('/api/split', { method: 'POST', body: JSON.stringify({ at: 2000 }) })
  document.getElementById('feedback').textContent = 'Chunks balanced across shards!'
  await refresh()
}

async function resetData() {
  if (!confirm('Delete all student data?')) return
  await api('/api/reset', { method: 'POST' })
  document.getElementById('feedback').textContent = 'All data cleared'
  await refresh()
}

refresh()
</script>
</body>
</html>
